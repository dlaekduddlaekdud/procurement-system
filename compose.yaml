services:
  mysql:
    image: mysql:8.4
    container_name: procurement-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-procurement}
      MYSQL_USER: ${DB_USERNAME:-procurement}
      MYSQL_PASSWORD: ${DB_PASSWORD:-procurement}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - procurement_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  procurement_mysql_data:
